name: solver CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
    
jobs:
  build-windows:
    runs-on: windows-latest
    
    strategy:
      matrix:
        config: [ debug, release ]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc
      
      - name: Compile Debug
        working-directory: solver
        if: matrix.config == 'debug'
        shell: bash
        run: gcc -w -g -o solver.exe field.c input.c main.c output.c search.c
      
      - name: Compile Release
        working-directory: solver
        if: matrix.config == 'release'
        shell: bash
        run: gcc -w -O2 -o solver.exe field.c input.c main.c output.c search.c
      
      - name: Run tests - Debug only
        working-directory: solver\tests
        if: matrix.config == 'debug'
        shell: cmd
        run: |
          call testrun.bat
          call testresult.bat
          if errorlevel 1 exit /b 1

  build-ubuntu:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        config: [ debug, release ]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Debug
        working-directory: solver
        if: matrix.config == 'debug'
        run: gcc -w -std=c11 -g -o solver field.c input.c main.c output.c search.c
      
      - name: Compile Release
        working-directory: solver
        if: matrix.config == 'release'
        run: gcc -w -std=c11 -O2 -o solver field.c input.c main.c output.c search.c
      
      - name: Make test scripts executable
        working-directory: solver
        if: matrix.config == 'debug'
        run: chmod +x tests/*.sh
      
      - name: Run tests - Debug only
        working-directory: solver
        if: matrix.config == 'debug'
        run: |
          cd tests
          ./testrun.sh
          ./testresult.sh

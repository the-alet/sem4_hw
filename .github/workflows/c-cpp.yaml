name: C++ CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:      
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -G "MinGW Makefiles"

    - name: Build
      shell: msys2 {0}
      run: |
        cd build
        cmake --build . --config ${{ matrix.configuration }} -- -j$(nproc)

    # - name: Run tests (only for Debug)
    #   if: matrix.configuration == 'Debug'
    #   shell: msys2 {0}
    #   working-directory: ./build
    #   run: |
    #       call ../tests/testrun.bat
    #       call ../tests/testresult.bat

  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.configuration }} -- -j$(nproc)


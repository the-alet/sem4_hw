name: solver CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
    
jobs:
  build-windows:
    runs-on: windows-latest
    
    strategy:
      matrix:
        config: [ debug, release ]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc
      
      - name: Compile Debug
        if: matrix.config == 'debug'
        shell: bash
        run: ls
        #run: gcc -g -o solver.exe field.c input.c main.c output.c search.c
      
      - name: Compile Release
        if: matrix.config == 'release'
        shell: bash
        run: ls
        #run: gcc -O2 -o solver.exe field.c input.c main.c output.c search.c
      
      - name: Run tests - Debug only
        if: matrix.config == 'debug'
        shell: cmd
        run: ls
        #run: |
          # cd tests
          # call testrun.bat
          # call testresult.bat
          # if errorlevel 1 exit /b 1

  build-ubuntu:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        config: [ debug, release ]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Debug
        if: matrix.config == 'debug'
        run: ls
        #run: gcc -g -o solver field.c input.c main.c output.c search.c
      
      - name: Compile Release
        if: matrix.config == 'release'
        run: ls
        #run: gcc -O2 -o solver field.c input.c main.c output.c search.c
      
      - name: Make test scripts executable
        if: matrix.config == 'debug'
        run: ls
        #run: chmod +x tests/*.sh
      
      - name: Run tests - Debug only
        if: matrix.config == 'debug'
        run: ls
        #run: |
          # cd tests
          # ./testrun.sh
          # ./testresult.sh
